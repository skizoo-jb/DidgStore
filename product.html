<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#050f0a"/>
<meta name="description" content="تفاصيل المنتج والاشتراكات من DidgStore"/>
<title>تفاصيل المنتج | DidgStore</title>

<link rel="stylesheet" href="./css/style.css"/>
<link rel="stylesheet" href="./css/reference-v2.css"/>
<link rel="stylesheet" href="./css/language.css"/>
<link rel="stylesheet" href="./css/brand-fix.css?v=3"/>
<link rel="stylesheet" href="./css/shop-experience.css?v=1"/>
<link rel="stylesheet" href="./css/product-reference-layout.css?v=2"/>
<!-- Official DidgStore original logo/favicon, no cropping -->
<link rel="icon" type="image/png" sizes="32x32" href="./assets/didgstore-original-favicon-32.png?v=8"/>
<link rel="icon" type="image/png" sizes="192x192" href="./assets/didgstore-original-favicon-192.png?v=8"/>
<link rel="shortcut icon" type="image/x-icon" href="./favicon.ico?v=8"/>
<link rel="stylesheet" href="./css/didgstore-original-logo.css?v=8"/>
</head>
<body class="shop-body pro-v2 didg-product-page">
<header class="site-header">
  <div class="container nav-wrap didg-detail-topbar">
    <a class="brand" href="./index.html" aria-label="DidgStore Home"><img class="didg-full-logo" src="./assets/didgstore-original-full.webp?v=8" alt="DidgStore"/></a>
    <a class="didg-back-store" href="./index.html#products" id="browseLink">← المنتجات</a>
    <div class="nav-actions">
      <div class="language-switch" role="group" aria-label="Language / اللغة"><button class="lang-option" data-lang="ar" type="button">AR</button><button class="lang-option" data-lang="en" type="button">EN</button></div>
      <button class="icon-button cart-icon" id="openCart" type="button" aria-label="سلة الطلبات"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.8"><path d="M3 4h2l2 12h11l3-9H6"></path><circle cx="10" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle></svg><small id="cartCount">0</small></button>
    </div>
  </div>
</header>
<main class="didg-product-main container">
  <div class="didg-crumb" id="breadcrumbs"><a href="./index.html">الرئيسية</a> / <span>المنتجات</span></div>
  <div id="productState" class="didg-detail-loading">جاري تحميل تفاصيل المنتج...</div>
  <section class="didg-detail-shell" id="detailShell" hidden>
    <div class="didg-detail-left">
      <section class="didg-detail-visual">
        <span class="didg-image-category" id="imageCategory"></span>
        <div class="didg-detail-media" id="detailMedia"></div>
      </section>
      <section class="didg-long-section" id="longSection" hidden>
        <h2 id="descriptionHeading">وصف المنتج</h2>
        <div class="didg-description-label" id="descriptionLabel">تفاصيل المنتج</div>
        <p class="didg-description-preview" id="descriptionPreview"></p>
        <div class="didg-long-text" id="longDescription" hidden></div>
        <button class="didg-full-description" id="toggleDescription" type="button" aria-expanded="false">عرض الوصف الكامل</button>
      </section>
    </div>
    <article class="didg-detail-content">
      <div class="didg-offer-brand" id="offerBrand">DIDGSTORE OFFERS</div>
      <span class="didg-detail-category" id="detailCategory"></span>
      <h1 id="detailName"></h1>
      <p class="didg-detail-short" id="detailShort"></p>
      <div class="didg-price-row">
        <span id="detailOldPrice" hidden></span>
        <strong id="detailPrice"></strong>
        <span class="didg-discount-badge" id="detailDiscount" hidden></span>
      </div>
      <div id="durationPicker" class="didg-duration-picker" hidden>
        <div class="didg-picker-heading"><strong id="durationHeading">اختار مدة الاشتراك</strong><small id="durationHint">الثمن كيتبدل حسب المدة</small></div>
        <div class="didg-duration-options" id="durationOptions"></div>
      </div>
      <div class="didg-detail-quantity">
        <span id="qtyLabel">اختار الكمية</span>
        <div class="didg-qty-buttons"><button id="qtyMinus" type="button" aria-label="نقص الكمية">−</button><b id="qtyValue">1</b><button id="qtyPlus" type="button" aria-label="زد الكمية">+</button></div>
      </div>
      <div class="didg-estimated-total"><span id="totalLabel">المجموع التقريبي</span><strong id="detailTotal">0 DH</strong></div>
      <div class="didg-detail-buttons didg-single-action">
        <button id="addToCart" class="didg-reference-cart" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 4h2l2 12h11l3-9H6"></path><circle cx="10" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle></svg><span id="addToCartText">أضف للسلة</span></button>
      </div>
      <p class="didg-detail-note" id="detailNote"></p>
    </article>
  </section>
  <section class="didg-related-section" id="relatedSection" hidden><div class="didg-section-heading"><h2 id="relatedHeading">منتجات مشابهة</h2><a id="moreProducts" href="./index.html#products">جميع المنتجات ←</a></div><div class="didg-related-grid" id="relatedGrid"></div></section>
</main>
<footer class="didg-product-footer">© <span id="year"></span> DidgStore <span>•</span> <a href="./index.html" id="footerBrowse">العودة للمتجر</a></footer>
<div class="modal-backdrop" id="cartModal" hidden><div class="cart-modal dialog" role="dialog" aria-modal="true" aria-labelledby="cartHeading"><div class="modal-head"><h2 id="cartHeading">سلة الطلبات</h2><button class="modal-close" data-close="cartModal" aria-label="إغلاق">×</button></div><div id="cartItems"></div><div id="cartFooter"></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="./js/product.js?v=2"></script>
</body></html>
